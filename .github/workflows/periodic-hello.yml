
name: Periodic Hello

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          # Check the URL and follow redirects
          url: https://fs-pokedex-d5w5.onrender.com
          follow-redirect: true
