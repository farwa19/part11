name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fs-pokedex
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies 
        run: npm install  
      - name: Install Playwright dependencies
        run: npm ci
        working-directory: .
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: .
      - name: Check style        
        run: npm run eslint
      - name: run test   
        run: npm run test
      - name: Deploy to Render
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip')
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "RENDER_DEPLOY_HOOK secret is not configured"; exit 1; }
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
     
  tag_release:
    needs: [simple_deployment_pipeline]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '#skip')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: patch