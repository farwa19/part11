name: simple_deployment_pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fs-pokedex

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check style
        run: npm run eslint


  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fs-pokedex

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Verify Chromium installation
        run: npx playwright install --list

      - name: Run Playwright tests
        run: npm run test

  deploy:
    needs: [build, e2e]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message || '', '#skip')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || {
            echo "RENDER_DEPLOY_HOOK secret is not configured"
            exit 1
          }
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"

  notify_failure:
    needs: [build, e2e, deploy]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.build.result == 'failure' ||
       needs.e2e.result == 'failure' ||
       needs.deploy.result == 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Notify pipeline failure
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "❌ Deployment Pipeline Failed!"
          description: |
            The pipeline encountered an error.

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Workflow:** ${{ github.workflow }}

            [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "Fullstack Deployment"
          color: 0xE74C3C

  notify_success:
    needs: [build, e2e, deploy]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Notify deployment success
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: "✅ Deployment Successful!"
          description: |
            A new version was deployed to production.

            **Repository:** ${{ github.repository }}
            **Commit:** ${{ github.sha }}

            [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "Fullstack Deployment"
          color: 0x2ECC71

  tag_release:
    needs: [build, e2e, deploy]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message || '', '#skip') &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch